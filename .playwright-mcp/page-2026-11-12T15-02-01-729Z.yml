        - button "¿Puedo usar Rodeo sin collares?" [ref=f7e216] [cursor=pointer]
        - paragraph [ref=f7e219]: Absolutamente. Se pueden gestionar lotes y planificar los pastoreos gracias a las imágenes satelitales de Copernicus (ESA), el clima de Open-Meteo y los modelos agronómicos de INTA y LART-FAUBA.
      - generic [ref=f7e220]:
        - button "¿Quién puede ver la información de mi campo?" [ref=f7e221] [cursor=pointer]
        - paragraph [ref=f7e224]: Cualquiera. La aplicación permite delegar roles con ciertos permisos.
      - generic [ref=f7e225]:
