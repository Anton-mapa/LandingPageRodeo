    - generic [ref=f7e204]:
      - generic [ref=f7e205]:
        - button "¿Necesito señal en el campo para usar Rodeo?" [expanded] [ref=f7e206] [cursor=pointer]
        - paragraph [ref=f7e209]: Los collares envían su posición por red celular o satelital según el modelo. Vos consultás todo desde la app cuando tengas conexión.
      - generic [ref=f7e210]:
        - button "¿Cada cuánto se actualizan los datos?" [ref=f7e211] [cursor=pointer]
        - paragraph [ref=f7e214]: Los datos meteorológicos se actualizan diariamente, mientras que los satelitales cada 5 días, si es que no hay nubes.
