    - heading "Como funciona" [level=2] [ref=f5e26]
    - paragraph [ref=f5e27]: "Rodeo junta lo que ve el satélite, lo que dice el clima y dónde está tu ganado, y lo convierte en una sola respuesta: qué lote está listo para pastorear y cuándo conviene entrar."
    - generic [ref=f5e28]:
      - generic [ref=f5e29]:
        - heading "1. Marcá tu campo" [level=3] [ref=f5e30]
        - paragraph [ref=f5e31]: Dibujá el límite de tu establecimiento y dividilo en lotes directamente sobre el mapa. Cargá el tipo de pastura, el último pastoreo de cada uno y listo, no hace falta nada más para empezar.
      - generic [ref=f5e32]:
        - heading "2. El satélite mira tus pasturas" [level=3] [ref=f5e33]
        - paragraph [ref=f5e34]: "Cada vez que pasa un satélite, Rodeo analiza la vegetación de cada lote: cuánto pasto hay, cuánta humedad tiene y cómo viene creciendo. Si hay nubes, el radar sigue midiendo igual."
      - generic [ref=f5e35]:
        - heading "3. Los collares ubican a tu ganado" [level=3] [ref=f5e36]
        - paragraph [ref=f5e37]: Los collares GPS muestran en el mapa dónde está el ganado, en qué lote entró y cuánto tiempo lleva ahí. Así sabés qué potrero se está usando y cuál está descansando, sin recorrer el campo.
      - generic [ref=f5e38]:
        - heading "4. Rodeo te dice cuándo entrar" [level=3] [ref=f5e39]
        - paragraph [ref=f5e40]: "Con todo eso, cada lote tiene su estado de regeneración: No apto, Cuidado, Perfecto o Regular. Ves de un vistazo cuál está listo hoy, cuál conviene esperar y cuál ya pasó su mejor momento. La decisión siempre es tuya."
